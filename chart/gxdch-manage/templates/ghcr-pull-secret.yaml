{{- if .Values.registry.pullSecret.create }}
{{- $registryUsername := required "registry.pullSecret.username is required when registry.pullSecret.create is true" .Values.registry.pullSecret.username -}}
{{- $registryPassword := required "registry.pullSecret.password is required when registry.pullSecret.create is true" .Values.registry.pullSecret.password -}}
{{- $registryAuth := printf "%s:%s" $registryUsername $registryPassword | b64enc -}}
{{- $dockerConfig := dict "auths" (dict .Values.registry.server (dict "username" $registryUsername "password" $registryPassword "auth" $registryAuth)) | toJson | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.pullSecret.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "gxdch-manage.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerConfig | quote }}
{{- end }}
