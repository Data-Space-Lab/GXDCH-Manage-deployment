apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gxdch-manage.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gxdch-manage.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "gxdch-manage.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "gxdch-manage.name" . }}
    spec:
      {{- if .Values.registry.pullSecret.create }}
      imagePullSecrets:
        - name: {{ .Values.registry.pullSecret.name | quote }}
      {{- else }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: gxdch-manage
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gxdch-manage.name" . }}-config
            - secretRef:
                name: {{ include "gxdch-manage.name" . }}-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.manageHost }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.manageHost }}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
