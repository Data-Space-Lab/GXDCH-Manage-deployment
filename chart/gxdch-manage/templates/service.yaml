apiVersion: v1
kind: Service
metadata:
  name: {{ include "gxdch-manage.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gxdch-manage.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "gxdch-manage.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
