apiVersion: v1
kind: ConfigMap
metadata:
  name: gxdch-manage-config
  namespace: gxdch-manage
data:
  DJANGO_ALLOWED_HOSTS: manage.gxdch.dil.collab-cloud.eu
  DJANGO_CSRF_TRUSTED_ORIGINS: https://manage.gxdch.dil.collab-cloud.eu
  KEYCLOAK_BASE_URL: https://dil.collab-cloud.eu/auth
  KEYCLOAK_REALM: gxdch
  KEYCLOAK_CLIENT_ID: gxdch-manage
  KEYCLOAK_SCOPE: openid profile email
  SITE_URL: https://manage.gxdch.dil.collab-cloud.eu
  ISSUER_ADMIN_BASE_URL: https://issuer.gxdch.dil.collab-cloud.eu/api/admin
  ISSUER_ADMIN_API_VERSION: v1beta
  ISSUER_IDENTITY_BASE_URL: https://identity.gxdch.dil.collab-cloud.eu/api/identity
  ISSUER_STS_BASE_URL: https://issuer.gxdch.dil.collab-cloud.eu/api/sts
  ISSUER_ISSUANCE_BASE_URL: https://issuer.gxdch.dil.collab-cloud.eu/api/issuance
  ISSUER_MEMBERSHIP_CREDENTIAL_DEFINITION_ID: gxdch-membership-credential
  ISSUER_MEMBERSHIP_ATTESTATION_ID: gxdch-membership-holder
  ISSUER_CONTEXT_ID: did:web:gxdch.dil.collab-cloud.eu:issuer
  ISSUER_DID: did:web:gxdch.dil.collab-cloud.eu:issuer
  ISSUER_DID_DOCUMENT_URL: https://issuer.gxdch.dil.collab-cloud.eu/did.json
  DATASPACE_SLUG: gxdch
  DATASPACE_NAME: GXDCH Dataspace
  DATASPACE_POLICY_PROFILE_NAME: GXDCH default dataspace policy profile
  DATASPACE_DSP_URL: https://gxdch.dil.collab-cloud.eu/dsp
  DATASPACE_CREDENTIAL_SERVICE_URL: https://issuer.gxdch.dil.collab-cloud.eu/api/issuance
  DATASPACE_TRUSTED_ISSUER_DID: did:web:gxdch.dil.collab-cloud.eu:issuer
  ONBOARDING_CREDENTIAL_TYPE: MembershipCredential
  CONNECTOR_MANAGEMENT_AUTHORIZATION: Bearer gxdch-onboarding
  DJANGO_DB_PATH: /app/data/db.sqlite3
