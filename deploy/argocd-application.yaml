apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gxdch-manage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Data-Space-Lab/GXDCH-Manage-deployment.git
    targetRevision: main
    path: chart/gxdch-manage
  destination:
    server: https://kubernetes.default.svc
    namespace: gxdch-manage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
